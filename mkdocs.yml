site_name: Global Insurance Underwriting Handbook
site_description: A comprehensive multi-volume reference for insurance underwriting — fundamentals, personal and commercial lines, rating & pricing, policy administration, claims, and US/UK regulation.
site_author: Global Insurance Underwriting Handbook Contributors
copyright: © 2026 Global Insurance Underwriting Handbook Contributors — Licensed under MIT

repo_url: https://github.com/example/global-insurance-underwriting-handbook

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist

